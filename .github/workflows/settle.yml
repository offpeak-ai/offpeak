name: Settled runs

# Publishes the receipts in `receipts/` onto the board-data branch as
# `nightly/SETTLED.md`.
#
# Fires when a receipt lands on main, and on demand. The deliberate act this
# workflow used to wait for is the pull request: main is protected, so a receipt
# only reaches this branch through review and four green checks. Making a human
# then remember to press a second button did not add rigour — it added a way for
# a real settlement to sit unpublished, which is the one outcome this ledger
# exists to prevent.
#
# board-data is written by CI and never by hand — the same rule the Spread Board
# follows, for the same reason: main is protected and a bot push there would be
# rejected, and a ledger anyone can hand-edit is not a ledger.

on:
  push:
    branches: [main]
    paths:
      - "receipts/**"
      - "tools/settle_report.py"
      - ".github/workflows/settle.yml"
  workflow_dispatch:

permissions:
  contents: write

# Shared with the Spread Board: everything that pushes board-data queues here.
concurrency:
  group: board-data
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the generator and the receipts (main)
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check out the ledger (board-data)
        uses: actions/checkout@v7
        with:
          ref: board-data
          path: board

      - name: Render
        run: |
          python tools/settle_report.py \
            --receipts receipts \
            --outdir board/nightly

      - name: Commit to board-data
        working-directory: board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nightly
          if git diff --staged --quiet; then
            echo "nothing changed — the ledger already says this"
            exit 0
          fi
          git commit -m "board: settled runs $(date -u +%Y-%m-%d)"
          git push
