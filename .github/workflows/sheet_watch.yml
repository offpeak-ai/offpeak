name: Sheet watch

# Notices the pricing pages this repo cites moving underneath its bundled price
# sheet, and writes the drift to `board-data`. The hash diff is the product; the
# LLM classification on top is the demo, and is allowed to fail.
#
# Runs at 03:00Z so the classifier's default deadline — the next 06:00Z — is a
# real three-hour window that still lands before the 06:30Z board mark. It is
# deliberately not on the mark cron: the watch should already be written by the
# time the board settles.
#
# Spend is capped inside the tool, not here, for the same reason Queue latency
# caps it there: a workflow-level guard protects the workflow, and what needs
# protecting is the spend.

# Catch-ups behind the primary, because GitHub drops scheduled runs silently —
# the 03:00Z watch was one of four that vanished on 2026-08-26/27. The drift
# record is meant to be one reading a day, so a run that finds today's reading
# already taken stops before fetching anything.
on:
  schedule:
    - cron: "7 3 * * *"     # the daily reading, before the 06:30Z mark
    - cron: "13 8 * * *"    #   catch-up, if the 03:07 watch never fired
    - cron: "27 13 * * *"   #   catch-up
    - cron: "43 20 * * *"   #   catch-up
  workflow_dispatch:
    inputs:
      classify:
        description: "Run the LLM classifier over each diff"
        required: false
        default: true
        type: boolean
      cap:
        description: "hard USD cap for the classification job"
        required: false
        default: "0.01"
      force:
        description: "Read again even if today's reading is already taken"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Everything that pushes board-data shares one queue (#19). Two workflows
# writing different files on the same branch still race at the push.
concurrency:
  group: board-data
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tool (main)
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the venue SDKs
        # Only the two venues default_venues() routes to. The fetch-and-hash
        # half needs nothing but the standard library.
        run: pip install "openai>=1.50" "anthropic>=0.40"

      - name: Check out the ledger (board-data)
        uses: actions/checkout@v7
        with:
          ref: board-data
          path: board

      - name: Skip if today's reading is already taken
        id: guard
        # snapshots.json stamps every source with the moment it was fetched, so
        # the ledger itself answers "has this run already happened today" — no
        # dependence on the run history, which is exactly what went missing.
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime as dt, json, os, pathlib
          today = dt.datetime.now(dt.timezone.utc).date().isoformat()
          snap = pathlib.Path("board/watch/snapshots.json")
          done = False
          if snap.exists() and os.environ.get("FORCE") != "true":
              try:
                  data = json.loads(snap.read_text())
                  done = any(
                      (v.get("fetched_at") or "").startswith(today)
                      for v in data.values() if isinstance(v, dict)
                  )
              except (OSError, ValueError):
                  done = False
          print(f"run={'false' if done else 'true'}")
          EOF
          cat "$GITHUB_OUTPUT"
        env:
          FORCE: ${{ inputs.force }}

      - name: Watch
        if: steps.guard.outputs.run == 'true'
        # A venue whose key is absent does not stop the watch: the classifier
        # records why it could not run and every hash-diff row publishes
        # anyway. Same degradation rule the Spread Board uses for EIA.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # The classifier's default deadline is the next 06:00Z. On the
          # 03:07 cron that is a three-hour window; on a catch-up at 20:43 it
          # is ten hours, and offpeak.run would hold this job — and the
          # board-data concurrency group with it — for all of them. Bound it.
          deadline=$(python -c 'import datetime as d; print((d.datetime.now(d.timezone.utc) + d.timedelta(hours=2)).strftime("%Y-%m-%dT%H:%M:%SZ"))')
          echo "classifier deadline: $deadline"
          python tools/sheet_watch.py \
            --outdir board/watch \
            --cap "${{ inputs.cap || '0.01' }}" \
            --deadline "$deadline" \
            ${{ (inputs.classify == false) && '--no-classify' || '' }}

      - name: Commit to board-data
        if: steps.guard.outputs.run == 'true'
        working-directory: board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch
          if git diff --staged --quiet; then
            echo "nothing moved — not committing an empty watch"
            exit 0
          fi
          git commit -m "watch: $(date -u +%Y-%m-%d)"
          git push
