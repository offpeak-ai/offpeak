name: Queue latency

# Measures how long a batch tier actually takes to land, and writes the
# observations to `board-data`. This one spends real money, which is why it is
# its own workflow, its own table and its own cap — the Spread Board next door
# observes open grid data and spends nothing, and the two must not be confused.
#
# Runs on the mark cron, once a day. The cap is a hard one cent per run and it
# is enforced inside the tool, not here: a workflow-level guard protects the
# workflow, and what needs protecting is the spend.

# GitHub's scheduler drops runs under load without saying so — four in a row
# went missing on 2026-08-26/27. The measured session still happens once a day
# and costs what it always cost; the extra crons are catch-ups. A run that finds
# today's session already measured switches to --resolve-only, which submits
# nothing, spends nothing, and settles the legs earlier runs parked. Resolution
# gets *better* the more often it runs: a leg resolved four hours after it
# landed carries a four-hour bound instead of a day-long one.
on:
  schedule:
    - cron: "37 6 * * *"    # the measured session, alongside the mark pass
    - cron: "23 10 * * *"   #   catch-up + resolve parked legs
    - cron: "17 14 * * *"   #   catch-up + resolve
    - cron: "41 18 * * *"   #   catch-up + resolve
    - cron: "29 22 * * *"   #   catch-up + resolve
  workflow_dispatch:
    inputs:
      mode:
        description: "series (measure latency) or windows (probe Groq's window strings)"
        required: true
        default: series
        type: choice
        options: [series, windows]
      cap:
        description: "hard USD cap for this run"
        required: false
        default: "0.01"
      force:
        description: "Measure even if today's session is already recorded"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Everything that pushes board-data shares one queue (#19). Two workflows
# writing different files on the same branch still race at the push.
concurrency:
  group: board-data
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tool (main)
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the venue SDKs
        run: |
          pip install "openai>=1.50" "anthropic>=0.40" \
                      "google-genai>=2.0" "mistralai>=2.9"

      - name: Check out the ledger (board-data)
        uses: actions/checkout@v7
        with:
          ref: board-data
          path: board

      - name: Measure
        # Four venues now, not two. Gemini and Mistral were both plan-gated when
        # this probe was written — Gemini answered FAILED_PRECONDITION and
        # Mistral 402 — so measuring their queues was measuring a paywall.
        # Billing is enabled on both and each has settled a real batch, so their
        # queues are now a number rather than an error, and belong on the board.
        #
        # Groq stays deliberately absent. Its batch tier is still plan-gated
        # (403) so there is nothing to measure, and its key stays out of this
        # workflow: the window probe is a manual, local act.
        #
        # A venue whose key is not set records itself skipped, with the reason,
        # and every other leg runs exactly as before — the same degradation rule
        # the Spread Board uses for EIA.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          # Today's session already on the board? Then this is a catch-up that
          # was not needed for measuring — resolve the parked legs and stop.
          extra=""
          if [ "${{ inputs.mode || 'series' }}" = "series" ] \
             && [ -f "board/nightly/$(date -u +%F)-queue.json" ] \
             && [ "${{ inputs.force }}" != "true" ]; then
            extra="--resolve-only"
            echo "today's session is already measured — resolving parked legs only, no spend"
          fi
          python tools/queue_probe.py \
            --mode "${{ inputs.mode || 'series' }}" \
            --venues anthropic,openai,gemini,mistral \
            --cap "${{ inputs.cap || '0.01' }}" \
            --max-wait 1800 \
            --outdir board/nightly \
            $extra

      - name: Commit to board-data
        working-directory: board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nightly
          if git diff --staged --quiet; then
            echo "nothing changed — not committing an empty session"
            exit 0
          fi
          git commit -m "queue: $(date -u +%Y-%m-%d)"
          git push
