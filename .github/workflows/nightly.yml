name: Spread Board

# The filename says nightly and stays that way: it is a cadence, not a claim.
# This runs once a day because the grid legs it marks have a real day/night
# session — the evening peak through the trough that follows — and because the
# calibration record wants one mark per session. The token spread it publishes
# alongside carries no clock at all: that one is priced by urgency, and a batch
# tier is half price at noon exactly as it is at midnight.
#
# Quotes at the open, marks at the close. Output is committed to the `board-data`
# branch, not to main: main is protected (PR + four required checks), so a
# scheduled bot push there would be rejected on every run.

# GitHub's scheduler is best-effort: it drops runs under load and says nothing.
# Four consecutive scheduled runs vanished across 2026-08-26/27 and the board
# simply had no rows for them. One cron a day is one chance a day, so each pass
# now has catch-ups behind it, and a run that finds its session already recorded
# exits without doing it twice.
#
# A catch-up must know which session it is *for*. The clock inference in
# night_span() flips at 16:00Z, so a mark that runs late marks the session that
# just started rather than the one that just finished — that is exactly how the
# 2026-08-27 board got a row of empty spreads. Every run therefore derives its
# session from the cron's *intended* time and passes it as --night, which makes
# a late run a repair instead of a second failure.
on:
  schedule:
    - cron: "37 6 * * *"    # mark  — the session just finished, carbon actuals
    - cron: "23 9 * * *"    #   catch-up, if the 06:37 mark never fired
    - cron: "17 12 * * *"   #   catch-up
    - cron: "11 15 * * *"   #   catch-up — last one before the 16:00Z pivot
    - cron: "7 19 * * *"    # quote — the session ahead, carbon forecast
    - cron: "19 21 * * *"   #   catch-up, if the 19:07 quote never fired
    - cron: "29 23 * * *"   #   catch-up
  workflow_dispatch:
    inputs:
      mode:
        description: "Which pass to run"
        required: true
        default: quote
        type: choice
        options: [quote, mark]
      night:
        description: "Session to run against (YYYY-MM-DD). Blank = derive it."
        required: false
        default: ""
      force:
        description: "Run even if this session is already recorded"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Everything that pushes board-data shares one queue. Two workflows writing
# different files on the same branch still race at the push, and a rejected
# push loses a night's mark.
concurrency:
  group: board-data
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the generator (main)
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check out the ledger (board-data)
        uses: actions/checkout@v7
        with:
          ref: board-data
          path: board

      - name: Pick the pass and the session
        id: pick
        # Derived from the cron's INTENDED time, never from when the run
        # actually started: a scheduled run can fire hours late, and "now" would
        # then resolve to the wrong side of the 16:00Z pivot and mark the wrong
        # session. board_report's own constant decides the pivot, so this can
        # not drift away from the tool it is feeding.
        env:
          SCHEDULE: ${{ github.event.schedule }}
          IN_MODE: ${{ inputs.mode }}
          IN_NIGHT: ${{ inputs.night }}
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime as dt, importlib.util, os
          spec = importlib.util.spec_from_file_location(
              "br", "tools/board_report.py")
          br = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(br)

          now = dt.datetime.now(dt.timezone.utc)
          cron = (os.environ.get("SCHEDULE") or "").split()
          if cron:
              # the most recent occurrence of this cron at or before now
              intended = now.replace(minute=int(cron[0]), hour=int(cron[1]),
                                     second=0, microsecond=0)
              if intended > now:
                  intended -= dt.timedelta(days=1)
          else:
              intended = now

          mode = os.environ.get("IN_MODE") or (
              "quote" if intended.hour >= br.NIGHT_START_HOUR_UTC else "mark")
          night = os.environ.get("IN_NIGHT") or br.default_night(intended, mode)
          print(f"mode={mode}")
          print(f"night={night}")
          EOF
          cat "$GITHUB_OUTPUT"

      - name: Skip if this session is already recorded
        id: guard
        # What makes a catch-up cheap: on the days nothing was dropped it costs
        # one checkout and stops. The record on board-data is the source of
        # truth for "did this already happen", not the run history.
        #
        # A mark is the exception, because a mark truncates at *now*: the 06:37
        # pass necessarily stops 23 minutes before the session it is marking
        # actually ends. So a mark counts as done only once its record covers
        # the whole session, and a later catch-up completes a partial one
        # instead of skipping it. That makes the record better on ordinary days
        # — the full session rather than one cut short — and it is what repairs
        # a mark written against the wrong side of the 16:00Z pivot.
        env:
          NIGHT: ${{ steps.pick.outputs.night }}
          MODE: ${{ steps.pick.outputs.mode }}
          FORCE: ${{ inputs.force }}
        run: |
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import datetime as dt, importlib.util, json, os, pathlib
          spec = importlib.util.spec_from_file_location(
              "br", "tools/board_report.py")
          br = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(br)

          night, mode = os.environ["NIGHT"], os.environ["MODE"]
          rec = pathlib.Path(f"board/nightly/{night}-{mode}.json")
          run, why = True, "no record yet"

          if os.environ.get("FORCE") == "true":
              why = "forced"
          elif rec.exists():
              run, why = False, "already recorded"
              if mode == "mark":
                  # complete only if it reaches the session's 07:00Z close
                  end = dt.datetime.fromisoformat(
                      dt.date.fromisoformat(night).isoformat()
                  ).replace(tzinfo=dt.timezone.utc) + dt.timedelta(
                      hours=br.NIGHT_START_HOUR_UTC + br.NIGHT_HOURS)
                  try:
                      to = json.loads(rec.read_text())["span_utc"]["to"]
                      covered = dt.datetime.fromisoformat(
                          to.replace("Z", "+00:00"))
                  except (OSError, ValueError, KeyError, TypeError):
                      run, why = True, "record unreadable — remarking"
                  else:
                      if covered < end:
                          run, why = True, (
                              f"partial mark (covers to {to}, session closes "
                              f"{end:%Y-%m-%dT%H:%MZ}) — completing it")
          print(f"run={'true' if run else 'false'}")
          print(f"why={why}")
          EOF
          cat "$GITHUB_OUTPUT"

      - name: Install US-zone data source
        # gridstatus is an Action-only dependency: the SDK does not need it and
        # the generator degrades to GB-only without it.
        if: steps.guard.outputs.run == 'true'
        run: pip install "gridstatus>=0.36"

      - name: Generate
        if: steps.guard.outputs.run == 'true'
        # EIA_API_KEY is optional: absent, the US carbon columns are recorded
        # unavailable and every other leg runs exactly as before.
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: |
          python tools/board_report.py \
            --mode "${{ steps.pick.outputs.mode }}" \
            --night "${{ steps.pick.outputs.night }}" \
            --us-zones \
            --outdir board/nightly

      - name: Commit to board-data
        if: steps.guard.outputs.run == 'true'
        working-directory: board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nightly
          if git diff --staged --quiet; then
            echo "nothing changed — not committing an empty night"
            exit 0
          fi
          git commit -m "board: ${{ steps.pick.outputs.mode }} $(date -u +%Y-%m-%d)"
          git push
