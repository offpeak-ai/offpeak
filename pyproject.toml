[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "offpeak"
version = "0.1.2"
description = "Deadline-priced inference: give AI jobs a deadline and run them on the cheapest venue — provider batch tiers (−50%) today. Same model, same tokens, a different hour."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Offpeak" }]
keywords = [
  "llm",
  "inference",
  "batch",
  "batch-api",
  "deadline",
  "scheduling",
  "cost-optimization",
  "openai",
  "anthropic",
  "finops",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
]
# Zero-dependency core. Provider SDKs are optional extras.
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.40"]
all = ["openai>=1.50", "anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6", "build", "twine"]

[project.urls]
Homepage = "https://github.com/offpeak-ai/offpeak"
Repository = "https://github.com/offpeak-ai/offpeak"
Issues = "https://github.com/offpeak-ai/offpeak/issues"
Changelog = "https://github.com/offpeak-ai/offpeak/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/offpeak"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
