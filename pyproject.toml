[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "offpeak"
version = "0.2.4.dev0"
description = "Deadline-priced inference: give AI jobs a deadline and run them on the cheapest venue that still meets it — provider batch tiers, 50% off, today. The deadline is the input; the discount follows."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Offpeak" }]
keywords = [
  "llm",
  "inference",
  "batch",
  "batch-api",
  "deadline",
  "scheduling",
  "cost-optimization",
  "openai",
  "anthropic",
  "finops",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",
]
# Zero-dependency core. Provider SDKs are optional extras.
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.50"]
anthropic = ["anthropic>=0.40"]
groq = ["groq>=0.11"]
mistral = ["mistralai>=2.9"]
gemini = ["google-genai>=2.0"]
all = ["openai>=1.50", "anthropic>=0.40"]
dev = ["pytest>=8", "ruff>=0.6", "build", "twine"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.26"]

[project.urls]
Homepage = "https://github.com/offpeak-ai/offpeak"
Repository = "https://github.com/offpeak-ai/offpeak"
Issues = "https://github.com/offpeak-ai/offpeak/issues"
Changelog = "https://github.com/offpeak-ai/offpeak/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/offpeak"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
